<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <title>Kali Dashboard</title>
</head>
<body>
  <canvas id="ghost-canvas"></canvas>
  <main>
    <section id="dashboard">
      <p id="Time">Time: Lädt...</p>
        <section id="system-info">
          <p id="cpu_temp">CPU Temp: Lädt...</p>
          <p id="cpu_load">CPU Load: Lädt...</p>
          <p id="disk_free">Disk Free: Lädt...</p>
          <p id="ram_free">RAM Info: Lädt...</p>
        </section>
    </section>
    <section id="button-container">
      <div class="button-group">
        <button id="Sys"></button>
        <p>Sys</p>
      </div>
      <div class="button-group">
        <button id="Pentest"></button>
        <p>Pentest</p>
      </div>
      <div class="button-group">
        <button id="db"></button>
        <p>db</p>
      </div>
      <div class="button-group">
        <button id="web"></button>
        <p>web</p>
      </div>
    </section>

    <!-- Passive Dashboards -->
     <section id="Sys_Dashboard" style="display: none;"></section>
     <section id="Pentest_Dashboard" style="display: none;"></section>
     <section id="db_Dashboard" style="display: none;"></section>
     <section id="web_Dashboard" style="display: none;"></section>

  </main>
  <script src="/static/disign.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
